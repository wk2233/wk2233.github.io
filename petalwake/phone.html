<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Petalwake 手机入口</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1522;color:#fff8ec;font:16px/1.55 system-ui,sans-serif;padding:24px}
  .card{max-width:420px}
  h1{font-size:28px;margin:0 0 12px}
  ol{padding-left:1.2em}
  li{margin:10px 0}
  code{background:rgba(255,255,255,.12);padding:2px 6px;border-radius:6px}
  a.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:999px;background:linear-gradient(180deg,#fff3e2,#ffd9e6);color:#2a1730;text-decoration:none;font-weight:700}
  .warn{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,158,196,.12);border:1px solid rgba(255,158,196,.35)}
</style>
</head>
<body>
  <div class="card">
    <h1>手机怎么进游戏</h1>
    <p>优先用下面按钮进游戏。若仍遇到英文 <b>Tunnel website ahead!</b> 页：</p>
    <ol>
      <li>看页面上 <code>This tunnel is hosted by:</code> 后面的 IP</li>
      <li>把那个 IP 原样填进输入框</li>
      <li>点 <b>Continue</b>，才会出现粉色加载条</li>
      <li>等出现 Take off，再点起飞</li>
    </ol>
    <div class="warn">首包很大，请用 WiFi，加载时不要切走页面。</div>
    <a class="btn" href="/">进入游戏</a>
  </div>
</body>
</html>
